{% extends "_layout.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 3rem auto; text-align: center">
  <div style="font-size: 3.5rem; font-weight: 800; color: var(--accent)">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="sub">{{ message }}</p>
  <a class="btn" href="{{ url_for('home') }}">Back to dashboard</a>
</div>
{% endblock %}
